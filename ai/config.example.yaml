# AI provider 설정 예시. 이 파일을 config.yaml로 복사해서 사용.
# provider 이름만 바꾸면 모델(미국/중국 등 어떤 제공사든)을 교체할 수 있다.
provider: null   # 등록된 provider 이름: null (기본, API 호출 없음)
                 # 추후 추가 예정: anthropic / openai / qwen / deepseek 등

# provider별 필요한 값은 아래에 자유롭게 추가 (예: api_key, model 이름 등).
# NullProvider는 아무 값도 필요 없음.
api_key: ""
model: ""
